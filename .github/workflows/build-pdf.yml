name: Build textbook PDF

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: true

      - name: Rename PDF
        run: cp main.pdf Playing-with-RISC-V_PRG32_textbook.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playing-with-RISC-V_PRG32_textbook
          path: Playing-with-RISC-V_PRG32_textbook.pdf

      - name: Commit rebuilt PDF
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Playing-with-RISC-V_PRG32_textbook.pdf
          git diff --cached --quiet || git commit -m "Rebuild textbook PDF"
          git push
